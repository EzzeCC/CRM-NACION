<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Centro de Mando - CRM Político y de Inteligencia Territorial (Firebase Cloud)">
  <title>Centro de Mando · CRM Territorial (Cloud)</title>
  <style>
    :root{
      --ink:#18212b;--muted:#68737e;--line:#d9dfe5;--paper:#fff;--canvas:#f5f7f9;--soft:#eef2f5;
      --noa:#e7b96b;--nea:#87b89a;--cuyo:#b49cd1;--centro:#77a9c6;--pampa:#d69592;--patagonia:#8db9c7;
      --accent:#1c516d;--accent2:#e9f0f4;--shadow:0 14px 34px rgba(25,39,52,.09);--danger:#c94a4a;--success:#2d8a56
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button{font:inherit;color:inherit;cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(420px,.9fr)}
    .map-side{min-height:100vh;padding:28px clamp(20px,4vw,60px) 24px;display:flex;flex-direction:column}
    .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
    .brand{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
    .brand h1{font-size:clamp(21px,2.2vw,30px);letter-spacing:-.055em;margin:3px 0 0;line-height:1.04}
    .brand h1 span{display:block;color:var(--accent);font-size:.44em;letter-spacing:.11em;text-transform:uppercase;margin-top:6px}
    .year{border-left:1px solid var(--line);padding-left:14px;color:var(--muted);font-size:12px;text-align:right}
    .map-frame{
      flex:1;min-height:480px;display:grid;place-items:center;
      background:radial-gradient(circle at 42% 42%,#fff 0 42%,transparent 72%);
      position:relative
    }
    .map-frame:after{
      content:"";position:absolute;inset:4% 8%;
      border:1px solid rgba(218,223,229,.5);border-radius:50%;pointer-events:none
    }
    .territory-map{
      width:min(100%,460px);height:auto;max-height:68vh;z-index:1;
      filter:drop-shadow(0 12px 18px rgba(29,49,63,.1));
      shape-rendering:geometricPrecision
    }
    .province{
      fill:#e4e9ee;stroke:#fff;stroke-width:0.9;vector-effect:non-scaling-stroke;
      transition:fill .2s ease, stroke .2s ease, filter .2s ease;cursor:pointer
    }
    .province:hover{fill:var(--region-color, #b8c4ce);stroke:var(--ink);stroke-width:1.4;filter:brightness(.97)}
    .province.is-active{fill:var(--region-color, #b8c4ce);stroke:var(--ink);stroke-width:1.8;filter:brightness(.94)}
    .province.region-lit{fill:var(--region-color);stroke:#fff;stroke-width:0.9;opacity:.95}
    .province.region-lit:hover,.province.region-lit.is-active{fill:var(--region-color);stroke:var(--ink);stroke-width:1.6;opacity:1;filter:brightness(.92)}
    .region-label{font-size:11px;font-weight:800;letter-spacing:.12em;fill:#5a6570;pointer-events:none;opacity:.5}
    .map-caption{z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:18px;border-top:1px solid var(--line);padding-top:14px}
    .legend{display:flex;flex-wrap:wrap;gap:6px 12px}
    .legend button{border:0;background:none;padding:2px 0;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
    .legend button:hover,.legend button.active{color:var(--ink)}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--dot)}
    .method{max-width:200px;text-align:right;font-size:11px;color:var(--muted)}
    
    .detail-side{background:var(--paper);border-left:1px solid var(--line);padding:28px clamp(20px,3vw,40px);overflow-y:auto;display:flex;flex-direction:column}
    .panel-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .sat-mark{width:31px;height:31px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:-.07em}
    .back{display:none;border:0;background:transparent;color:var(--accent);font-weight:700;padding:7px 0}
    .back.visible{display:inline-flex;align-items:center;gap:7px}
    .back:before{content:"←"}
    
    .screen{padding-top:22px;flex:1}
    .screen-title{font-size:22px;line-height:1.05;letter-spacing:-.05em;margin:0 0 6px}
    .screen-subtitle{margin:0 0 20px;color:var(--muted);font-size:13px}
    
    .region-list{display:grid;gap:6px}
    .region-row{
      width:100%;text-align:left;border:1px solid transparent;background:transparent;
      padding:11px 12px;display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:10px;
      border-radius:5px;transition:.2s
    }
    .region-row:hover{background:var(--soft);border-color:var(--line)}
    .region-row strong{font-size:13px}
    .region-row small{color:var(--muted);font-size:11px}
    
    .region-hero{border-left:4px solid var(--region-color);padding:12px 0 12px 14px;margin-bottom:16px;background:linear-gradient(90deg,var(--region-tint),transparent)}
    .region-hero h2{margin:0 0 4px;font-size:22px;letter-spacing:-.05em}
    .province-list{display:grid;gap:6px}
    .province-row{
      border:1px solid var(--line);background:#fff;padding:11px 13px;width:100%;text-align:left;
      display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:4px
    }
    .province-row:hover{border-color:var(--accent);background:#fbfcfd}
    .province-row small{color:var(--muted);display:block;margin-top:2px}
    
    .province-head{padding-bottom:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
    .province-head .tag{display:inline-block;color:var(--accent);font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;margin-bottom:6px}
    .province-head h2{font-size:26px;letter-spacing:-.065em;line-height:1;margin:0 0 4px}
    
    .crm-section{margin-top:20px}
    .crm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .crm-header h3{font-size:14px;text-transform:uppercase;letter-spacing:.1em;margin:0;color:var(--ink)}
    .btn-primary{background:var(--accent);color:#fff;border:0;padding:7px 12px;border-radius:4px;font-weight:600;font-size:12px}
    .btn-primary:hover{background:#143b4f}
    
    .contact-card{background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:12px;margin-bottom:10px;position:relative}
    .contact-card h4{margin:0 0 4px;font-size:14px}
    .contact-card p{margin:2px 0;font-size:12px;color:var(--muted)}
    .badge{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase;margin-right:5px;margin-top:4px}
    .badge-politica{background:#e2ecf4;color:var(--accent)}
    .badge-empresarial{background:#f4f1e2;color:#8a7a2d}
    .badge-medios{background:#f4e2e2;color:var(--danger)}
    .badge-territorio{background:#e2f4e6;color:var(--success)}
    .del-contact{position:absolute;top:10px;right:10px;background:none;border:0;color:var(--muted);font-weight:bold;cursor:pointer}
    .del-contact:hover{color:var(--danger)}

    /* Modal formulario */
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;place-items:center;padding:20px}
    .modal.open{display:grid}
    .modal-content{background:#fff;width:100%;max-width:480px;border-radius:6px;padding:24px;box-shadow:var(--shadow)}
    .modal-content h3{margin-top:0;font-size:18px}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:4px;font-weight:700}
    .form-control{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font:inherit;font-size:13px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    .btn-secondary{background:transparent;border:1px solid var(--line);padding:7px 12px;border-radius:4px;font-weight:600;font-size:12px}
    
    @media(max-width:850px){
      .app{display:block}
      .map-side{min-height:auto;padding:20px}
      .detail-side{border-left:0;border-top:1px solid var(--line);padding:20px}
    }
  </style>

        <div class="form-group">
          <label>Nombre y Apellido / Organización</label>
          <input type="text" id="cName" class="form-control" required placeholder="Ej. Juan Pérez">
        </div>
        <div class="form-group">
          <label>Categoría Estratégica</label>
          <select id="cCategory" class="form-control">
            <option value="politica">Política Activa / Dirigente</option>
            <option value="empresarial">Círculo Económico / Empresarial</option>
            <option value="medios">Medios y Comunicación</option>
            <option value="territorio">Territorio / Social</option>
          </select>
        </div>
        <div class="form-group">
          <label>Teléfono / Contacto</label>
          <input type="text" id="cPhone" class="form-control" placeholder="Ej. +54 9 341 ...">
        </div>
        <div class="form-group">
          <label>Notas de Campo / Observaciones</label>
          <textarea id="cNotes" class="form-control" rows="3" placeholder="Ej. Gira Rosario. Reclamos de infraestructura..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="closeModal">Cancelar</button>
          <button type="submit" class="btn-primary" id="saveBtn">Guardar en la Nube</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const regions={
      noa:{name:'Noroeste Argentino',short:'NOA',color:'#e7b96b',members:['jujuy','salta','tucuman','santiago-del-estero','catamarca'],note:'Corredor andino y subandino'},
      nea:{name:'Noreste Argentino',short:'NEA',color:'#87b89a',members:['formosa','chaco','misiones','corrientes'],note:'Corredor fluvial y forestal'},
      cuyo:{name:'Cuyo',short:'CUYO',color:'#b49cd1',members:['la-rioja','san-juan','mendoza','san-luis'],note:'Corredor cordillerano y productivo'},
      centro:{name:'Centro',short:'CENTRO',color:'#77a9c6',members:['cordoba','santa-fe','entre-rios'],note:'Núcleo productivo y logístico'},
      pampa:{name:'Provincia de Buenos Aires / CABA',short:'PBA / CABA',color:'#d69592',members:['la-pampa','buenos-aires','caba'],note:'Área pampeana y metropolitana'},
      patagonia:{name:'Patagonia',short:'PATAGONIA',color:'#8db9c7',members:['neuquen','rio-negro','chubut','santa-cruz','tierra-del-fuego'],note:'Corredor austral, energético y marítimo'}
    };
    
    const provinces={
      'jujuy':{name:'Jujuy',region:'noa'}, 'salta':{name:'Salta',region:'noa'}, 'tucuman':{name:'Tucumán',region:'noa'}, 'santiago-del-estero':{name:'Santiago del Estero',region:'noa'}, 'catamarca':{name:'Catamarca',region:'noa'},
      'formosa':{name:'Formosa',region:'nea'}, 'chaco':{name:'Chaco',region:'nea'}, 'misiones':{name:'Misiones',region:'nea'}, 'corrientes':{name:'Corrientes',region:'nea'},
      'la-rioja':{name:'La Rioja',region:'cuyo'}, 'san-juan':{name:'San Juan',region:'cuyo'}, 'mendoza':{name:'Mendoza',region:'cuyo'}, 'san-luis':{name:'San Luis',region:'cuyo'},
      'cordoba':{name:'Córdoba',region:'centro'}, 'santa-fe':{name:'Santa Fe (Rosario)',region:'centro'}, 'entre-rios':{name:'Entre Ríos',region:'centro'},
      'la-pampa':{name:'La Pampa',region:'pampa'}, 'buenos-aires':{name:'Buenos Aires',region:'pampa'}, 'caba':{name:'CABA',region:'pampa'},
      'neuquen':{name:'Neuquén',region:'patagonia'}, 'rio-negro':{name:'Río Negro',region:'patagonia'}, 'chubut':{name:'Chubut',region:'patagonia'}, 'santa-cruz':{name:'Santa Cruz',region:'patagonia'}, 'tierra-del-fuego':{name:'Tierra del Fuego',region:'patagonia'}
    };

    let cacheContacts = {};
    const screen=document.getElementById('screen');
    const back=document.getElementById('back');
    const legend=document.getElementById('legend');
    const contactModal=document.getElementById('contactModal');
    const contactForm=document.getElementById('contactForm');
    let state={view:'home',id:null};
    let currentProvinceForAdd = null;

    document.querySelectorAll('.province').forEach(el=>{
      const p=provinces[el.dataset.id];
      if(p) el.style.setProperty('--region-color', regions[p.region].color);
    });

    function activeMap(){
      const regionId = state.view==='region' ? state.id : (state.view==='province' ? provinces[state.id].region : null);
      document.querySelectorAll('.province').forEach(el=>{
        const p=provinces[el.dataset.id];
        const lit = Boolean(regionId && p && p.region===regionId);
        el.classList.toggle('region-lit', lit);
        el.classList.toggle('is-active', state.view==='province' && el.dataset.id===state.id);
      });
      document.querySelectorAll('.legend button').forEach(el=>{
        el.classList.toggle('active', state.view==='region' && el.dataset.id===state.id);
      });
    }

    async function cargarContactosCloud(provinceId){
      try {
        const querySnapshot = await window.getDocs(window.collection(window.db, "contactos_" + provinceId));
        let lista = [];
        querySnapshot.forEach((docSnap) => {
          lista.push({ docId: docSnap.id, ...docSnap.data() });
        });
        cacheContacts[provinceId] = lista;
        renderContactsUI(provinceId);
      } catch (e) {
        console.error("Error al leer de Firestore: ", e);
      }
    }

    function renderContactsUI(provinceId){
      const contacts = cacheContacts[provinceId] || [];
      const container = document.getElementById('contactsList');
      if(!container) return;

      if(contacts.length === 0){
        container.innerHTML = '<p style="color:var(--muted);font-size:12px;">No hay contactos en la nube para esta jurisdicción.</p>';
        return;
      }

      container.innerHTML = contacts.map(c=>`
        <div class="contact-card">
          <button class="del-contact" onclick="eliminarContacto('${provinceId}', '${c.docId}')">×</button>
          <h4>${c.name}</h4>
          <span class="badge badge-${c.category}">${c.category}</span>
          <p>📞 ${c.phone || 'Sin teléfono'}</p>
          <p>💬 ${c.notes || 'Sin notas'}</p>
        </div>
      `).join('');
    }

    window.eliminarContacto = async function(provinceId, docId){
      if(!confirm("¿Eliminar este contacto de la base de datos?")) return;
      try {
        await window.deleteDoc(window.doc(window.db, "contactos_" + provinceId, docId));
        cargarContactosCloud(provinceId);
      } catch(e) {
        alert("Error al eliminar: " + e.message);
      }
    };

    function render(){
      activeMap();
      back.classList.toggle('visible', state.view!=='home');
      back.textContent = state.view==='province' ? 'Volver a la región' : 'Volver al mapa general';

      if(state.view==='home'){
        screen.innerHTML=`
          <h2 class="screen-title">Selección Regional</h2>
          <p class="screen-subtitle">Seleccioná una región para acceder a los contactos sincronizados en la nube.</p>
          <div class="region-list">${Object.entries(regions).map(([id,r])=>`
            <button type="button" class="region-row" data-region="${id}">
              <i class="dot" style="--dot:${r.color}"></i>
              <span><strong>${r.name}</strong><small>${r.members.length} jurisdicciones · ${r.note}</small></span>
              <span>→</span>
            </button>`).join('')}
          </div>`;
      }

      if(state.view==='region'){
        const r=regions[state.id];
        screen.innerHTML=`
          <div class="region-hero" style="--region-color:${r.color};--region-tint:${r.color}26">
            <div class="eyebrow">Región</div>
            <h2>${r.name}</h2>
            <p class="screen-subtitle">${r.note}. Seleccioná una provincia.</p>
          </div>
          <div class="province-list">${r.members.map(id=>{
            const p=provinces[id];
            return `<button type="button" class="province-row" data-province="${id}">
              <span><strong>${p.name}</strong><small>Conectado a Firestore</small></span>
              <span>→</span>
            </button>`;
          }).join('')}</div>`;
      }

      if(state.view==='province'){
        const p=provinces[state.id];
        const r=regions[p.region];
        
        screen.innerHTML=`
          <div class="province-head">
            <div>
              <div class="tag" style="color:${r.color}">${r.name}</div>
              <h2>${p.name}</h2>
            </div>
            <button class="btn-primary" id="openAddModal">+ Nuevo Contacto</button>
          </div>
          
          <div class="crm-section">
            <div class="crm-header">
              <h3>Directorio en la Nube (Firestore)</h3>
            </div>
            <div id="contactsList">
              <p style="color:var(--muted);font-size:12px;">Sincronizando con servidores seguros...</p>
            </div>
          </div>`;
        
        currentProvinceForAdd = state.id;
        cargarContactosCloud(state.id);
      }
    }

    legend.innerHTML=Object.entries(regions).map(([id,r])=>
      `<button type="button" data-region="${id}"><i class="dot" style="--dot:${r.color}"></i>${r.short}</button>`
    ).join('');

    function goRegion(id){ state={view:'region',id}; render(); }
    function goProvince(id){ state={view:'province',id}; render(); }

    document.addEventListener('click',e=>{
      const r=e.target.closest('[data-region]');
      const p=e.target.closest('[data-province]');
      const m=e.target.closest('.province');
      if(r) goRegion(r.dataset.region);
      else if(p) goProvince(p.dataset.province);
      else if(m) goProvince(m.dataset.id);
      else if(e.target.closest('#openAddModal')){
        contactModal.classList.add('open');
      }
      else if(e.target.closest('#closeModal')){
        contactModal.classList.remove('open');
      }
    });

    contactForm.addEventListener('submit', async e=>{
      e.preventDefault();
      if(!currentProvinceForAdd) return;
      
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.textContent = "Guardando...";
      saveBtn.disabled = true;

      const newContact = {
        name: document.getElementById('cName').value,
        category: document.getElementById('cCategory').value,
        phone: document.getElementById('cPhone').value,
        notes: document.getElementById('cNotes').value,
        createdAt: new Date().toISOString()
      };

      try {
        await window.addDoc(window.collection(window.db, "contactos_" + currentProvinceForAdd), newContact);
        contactForm.reset();
        contactModal.classList.remove('open');
        cargarContactosCloud(currentProvinceForAdd);
      } catch (err) {
        alert("Error al guardar en Firebase: " + err.message);
      } finally {
        saveBtn.textContent = "Guardar en la Nube";
        saveBtn.disabled = false;
      }
    });

    back.addEventListener('click',()=>{
      state = state.view==='province' ? {view:'region', id:provinces[state.id].region} : {view:'home', id:null};
      render();
    });

    render();
  </script>
</body>
</html>
